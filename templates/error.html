{% extends "base.html" %}

{% block title %}{{ title }} · BacaMudah{% endblock %}

{% block content %}
<section class="hero">
  <h1>{{ title }}</h1>
  <div class="greeting">
    {% set mascot_mood = "sedih" %}
    {% include "_maskot.html" %}

<p class="error-actions">
  <a class="btn btn-primary" href="{{ url_for('index') }}">Kembali ke halaman utama</a>
</p>
{% endblock %}

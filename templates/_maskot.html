{# Maskot BacaMudah: buku terbuka yang tersenyum. Hanya hiasan, jadi disembunyikan dari pembaca layar.
   Variabel opsional: mascot_class (kelas tambahan) dan mascot_mood ("sedih" untuk halaman error). #}
<svg class="mascot {{ mascot_class or '' }}" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
  <path class="mascot-book" d="M32 17C25 12 15 11 6 13.5V51c9-2.5 19-1.5 26 3.5z"/>
  <path class="mascot-book" d="M32 17c7-5 17-6 26-3.5V51c-9-2.5-19-1.5-26 3.5z"/>
  <path class="mascot-spine" d="M32 17v37.5"/>
  <circle class="mascot-eye" cx="20" cy="29" r="5"/>
  <circle class="mascot-eye" cx="44" cy="29" r="5"/>
  <circle class="mascot-pupil" cx="21" cy="30" r="2.4"/>
  <circle class="mascot-pupil" cx="45" cy="30" r="2.4"/>
  <circle class="mascot-cheek" cx="13.5" cy="38" r="3"/>
  <circle class="mascot-cheek" cx="50.5" cy="38" r="3"/>
  {% if mascot_mood == "sedih" %}
  <path class="mascot-mouth" d="M25 45q7-5 14 0"/>
  {% else %}
  <path class="mascot-mouth" d="M25 40q7 7 14 0"/>
  {% endif %}
</svg>
